services:
  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=secretpw
      - DB_NAME=shopmetrics
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpw
      POSTGRES_DB: shopmetrics

    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: