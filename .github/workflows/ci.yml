name: CI/CD Pipeline ShopMetrics

# Déclenche le workflow à chaque push ou pull request sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Configurer l'environnement Node.js
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 3. Installer et tester le Backend
      - name: Installation et test du Backend
        run: |
          cd backend
          npm install
          # npm test (si vous avez des tests configurés)

      # 4. Installer et builder le Frontend
      - name: Installation et build du Frontend
        run: |
          cd frontend
          npm install
          npm run build

      # 5. Validation par Docker Compose (Vérification que les conteneurs se construisent bien)
      - name: Test de build Docker Compose
        run: |
          docker compose config